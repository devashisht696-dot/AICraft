<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="AICraft Class 10 Artificial Intelligence learning website"><title>Quiz | AICraft</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css"></head><body><div class="bg"></div><header class="header"><nav class="nav container"><a class="brand" href="../index.html"><img src="../assets/aicraft-logo.svg" alt="AICraft"></a><button class="menu" aria-label="Menu">☰</button><div class="navlinks"><a href="../index.html">Home</a><a href="ai.html">Learn AI</a><a href="applications.html">Applications</a><a href="notes.html">Notes</a><a href="quiz.html">Quiz</a><a href="projects.html">Projects</a></div></nav></header><main><section class="section container"><div class="heading"><span class="eyebrow">04 / QUIZ ZONE</span><h1 style="font:700 clamp(2.8rem,6vw,5rem) Space Grotesk">Test your <span class="gradient">knowledge.</span></h1><p>Answer 10 questions. Select an option, then move to the next question.</p></div><div class="quiz"><div class="quiztop"><span id="qcount">Question 1 of 10</span><span id="qscore">Score: 0</span></div><div class="quizbar"><i id="qprogress"></i></div><h2 id="question">Loading...</h2><div id="answers" class="answers"></div><div class="quiznext"><button id="next" class="btn primary" disabled>Next Question →</button></div><div id="result" class="result hidden"></div></div></section>
<script>
const qs=[
["What does AI stand for?",["Automated Internet","Artificial Intelligence","Advanced Information","Artificial Internet"],1],
["Which is an example of AI in everyday life?",["A wooden chair","A recommendation system","A pencil","A notebook"],1],
["Machine learning mainly allows computers to...",["Learn patterns from data","Become physically larger","Work without electricity","Remove all human decisions"],0],
["Which domain deals with human language?",["Computer Vision","Natural Language Processing","Data Storage","Robotics only"],1],
["Which is an AI ethics concern?",["Screen brightness","Privacy","Keyboard size","File extension"],1],
["Computer vision focuses on...",["Understanding visual information","Charging batteries","Writing by hand","Keyboard design"],0],
["AI systems commonly depend on...",["Data and algorithms","Paper only","No input","Mechanical gears only"],0],
["Which field can use AI to analyze medical images?",["Healthcare","Carpentry","Fashion only","Sports equipment only"],0],
["Why is fairness important in AI?",["To make systems colorful","To reduce harmful bias and unequal outcomes","To increase screen size","To make computers heavier"],1],
["Which is a responsible AI practice?",["Sharing private data","Ignoring errors","Protecting personal information","Removing human oversight everywhere"],2]
];
let i=0,s=0,picked=false;const q=document.querySelector("#question"),a=document.querySelector("#answers"),n=document.querySelector("#next"),count=document.querySelector("#qcount"),score=document.querySelector("#qscore"),bar=document.querySelector("#qprogress"),res=document.querySelector("#result");
function render(){picked=false;n.disabled=true;const x=qs[i];count.textContent=`Question ${i+1} of ${qs.length}`;score.textContent=`Score: ${s}`;bar.style.width=`${(i+1)*10}%`;q.textContent=x[0];a.innerHTML="";x[1].forEach((v,j)=>{let b=document.createElement("button");b.className="answer";b.textContent=v;b.onclick=()=>choose(j,b);a.appendChild(b)})}
function choose(j,b){if(picked)return;picked=true;n.disabled=false;let c=qs[i][2];[...a.children].forEach((x,k)=>{x.disabled=true;if(k===c)x.classList.add("correct")});if(j===c)s++;else b.classList.add("wrong");score.textContent=`Score: ${s}`}
n.onclick=()=>{if(i<qs.length-1){i++;render()}else{q.textContent="Quiz complete!";a.innerHTML="";res.classList.remove("hidden");res.innerHTML=`<h2>${s}/10</h2><p>You scored ${s*10}%. Review the notes and try again.</p>`;n.textContent="Restart Quiz ↻";n.onclick=()=>{i=0;s=0;res.classList.add("hidden");n.textContent="Next Question →";n.onclick=next;render()}}};
function next(){if(i<qs.length-1){i++;render()}else{q.textContent="Quiz complete!";a.innerHTML="";res.classList.remove("hidden");res.innerHTML=`<h2>${s}/10</h2><p>You scored ${s*10}%. Review the notes and try again.</p>`;n.textContent="Restart Quiz ↻";n.onclick=()=>{i=0;s=0;res.classList.add("hidden");n.textContent="Next Question →";n.onclick=next;render()}}}
render();
</script></main><footer class="footer"><div class="container footergrid"><div><img src="../assets/aicraft-logo.svg" alt="AICraft"><p>Explore. Learn. Create with AI.</p></div><div class="footerlinks"><a href="../index.html">Home</a><a href="ethics.html">Ethics</a><a href="quiz.html">Quiz</a></div><div class="right"><p>© <span id="year"></span> AICraft</p></div></div></footer><div class="modal hidden2"><div class="modalbox"><button class="close">×</button><div id="modalBody"></div></div></div><script src="../script.js"></script></body></html>
